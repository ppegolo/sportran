name: release

# Automate deployment to PyPI when creating a release tag vX.Y.Z
# will only be published to PyPI if the git tag matches the release version
# and lint/tests pass

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
jobs:

  check-release-tag:

    # Only run this job on the main repository and not on forks
    if: github.repository == 'sissaschool/sportran'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - run: python .github/workflows/check_release_tag.py "$GITHUB_REF" pyproject.toml

  lint:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: pip

    - name: Install tox
      run: python -m pip install --upgrade pip tox

    - name: Cache Matplotlib
      uses: actions/cache@v4
      with:
        path: ~/.cache/matplotlib
        key: matplotlib-${{ runner.os }}-py310

    - name: Run lint
      run: tox -e lint

  tests:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - python-version: "3.10"
            tox-env: py310
          - python-version: "3.11"
            tox-env: py311
          - python-version: "3.12"
            tox-env: py312

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install tox
      run: python -m pip install --upgrade pip tox

    - name: Cache Matplotlib
      uses: actions/cache@v4
      with:
        path: ~/.cache/matplotlib
        key: matplotlib-${{ runner.os }}-${{ matrix.python-version }}

    - name: Test with pytest
      run: tox -e ${{ matrix.tox-env }}

  publish:

    name: Publish to PyPI

    needs: [check-release-tag, lint, tests]

    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Build package
      run: |
        python -m pip install --upgrade pip build
        python -m build
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_SPORTRAN }}
