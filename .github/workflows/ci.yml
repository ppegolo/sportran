name: continuous-integration

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install tox
        run: python -m pip install --upgrade pip tox

      - name: Cache Matplotlib
        uses: actions/cache@v4
        with:
          path: ~/.cache/matplotlib
          key: matplotlib-${{ runner.os }}-py310

      - name: Run lint checks
        run: tox -e lint

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.10"
            tox-env: py310
          - python-version: "3.11"
            tox-env: py311
          - python-version: "3.12"
            tox-env: py312
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install tox
        run: python -m pip install --upgrade pip tox

      - name: Cache Matplotlib
        uses: actions/cache@v4
        with:
          path: ~/.cache/matplotlib
          key: matplotlib-${{ runner.os }}-${{ matrix.python-version }}

      - name: Run test suite
        run: tox -e ${{ matrix.tox-env }}

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install tox
        run: python -m pip install --upgrade pip tox

      - name: Build docs
        run: tox -e docs
