[tox]
envlist = format, lint, build, py310
isolated_build = true
skip_missing_interpreters = true

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312

[testenv]
description = Run test suite with pytest
extras = tests
lint_folders =
    "{toxinidir}/src/sportran"
mypy_folders =
    "{toxinidir}/src/sportran"
lint_strict_folders =
    "{toxinidir}/src/sportran/current/results.py" \
    "{toxinidir}/src/sportran/plotter/style.py"
exclude_tests_regex = (^|/)[^/]*test[^/]*$
setenv =
    MPLBACKEND = Agg
commands =
    pytest -sv tests

[testenv:py310]
setenv =
    MPLBACKEND = Agg
    MPLCONFIGDIR = {toxworkdir}/mplconfig
commands_pre =
    python -c "import matplotlib.font_manager as fm; fm._load_fontmanager(try_read_cache=False)"

[testenv:py311]
setenv =
    MPLBACKEND = Agg
    MPLCONFIGDIR = {toxworkdir}/mplconfig
commands_pre =
    python -c "import matplotlib.font_manager as fm; fm._load_fontmanager(try_read_cache=False)"

[testenv:py312]
setenv =
    MPLBACKEND = Agg
    MPLCONFIGDIR = {toxworkdir}/mplconfig
commands_pre =
    python -c "import matplotlib.font_manager as fm; fm._load_fontmanager(try_read_cache=False)"

[testenv:format]
description = Apply Ruff formatting and autofixes on strict scope
skip_install = true
deps =
    ruff>=0.6.0
commands =
    ruff check --fix {[testenv]lint_folders}
    ruff format {[testenv]lint_folders}

[testenv:lint]
description = Run linting and type checks
skip_install = true
deps =
    ruff>=0.6.0
    mypy>=1.11.0
    pydoclint>=0.5.0
    sphinx-lint>=1.0.0
commands =
    ruff format --diff {[testenv]lint_folders}
    ruff check {[testenv]lint_folders}
    mypy {[testenv]mypy_folders}
    sphinx-lint --enable all --disable line-too-long -i {toxinidir}/docs/source/_autosummary {toxinidir}/docs/source {toxinidir}/README.md
    mypy --exclude {[testenv]exclude_tests_regex} --disallow-untyped-defs {[testenv]lint_strict_folders}
    pydoclint --exclude {[testenv]exclude_tests_regex} {[testenv]lint_strict_folders}

[testenv:type]
description = Run mypy type checking
skip_install = true
deps =
    mypy>=1.11.0
commands =
    mypy {[testenv]lint_strict_folders}

[testenv:build]
description = Build package and validate artifacts
skip_install = true
deps =
    build>=1.2.2
    check-manifest>=0.50
    twine>=5.0.0
commands =
    python -m build
    twine check dist/*.tar.gz dist/*.whl
    check-manifest --ignore "docs/_build/**,docs/source/_autosummary/**,tests/data,tests/data/**,setup.py" {toxinidir}

[testenv:docs]
description = Build Sphinx documentation
extras = doc
setenv =
    PATH = {envsitepackagesdir}/pypandoc/files:{env:PATH}
    PYPANDOC_PANDOC = {envsitepackagesdir}/pypandoc/files/pandoc
commands_pre =
    python -c "import pypandoc; pypandoc.get_pandoc_version()"
commands =
    sphinx-build -W --keep-going -b html docs/source docs/_build/html

[testenv:notebooks]
description = Execute notebook-based tests only
extras = tests
setenv =
    MPLBACKEND = Agg
    MPLCONFIGDIR = {toxworkdir}/mplconfig
commands_pre =
    python -c "import matplotlib.font_manager as fm; fm._load_fontmanager(try_read_cache=False)"
commands =
    pytest -sv tests/test_notebooks.py
