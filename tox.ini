[tox]
envlist = format, lint, py310
isolated_build = true
skip_missing_interpreters = true

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312

[testenv]
description = Run test suite with pytest
extras = tests
setenv =
    MPLBACKEND = Agg
commands =
    pytest -sv tests

[testenv:py310]
setenv =
    MPLBACKEND = Agg
    MPLCONFIGDIR = {toxworkdir}/mplconfig
commands_pre =
    python -c "import matplotlib.font_manager as fm; fm._load_fontmanager(try_read_cache=False)"

[testenv:py311]
setenv =
    MPLBACKEND = Agg
    MPLCONFIGDIR = {toxworkdir}/mplconfig
commands_pre =
    python -c "import matplotlib.font_manager as fm; fm._load_fontmanager(try_read_cache=False)"

[testenv:py312]
setenv =
    MPLBACKEND = Agg
    MPLCONFIGDIR = {toxworkdir}/mplconfig
commands_pre =
    python -c "import matplotlib.font_manager as fm; fm._load_fontmanager(try_read_cache=False)"

[testenv:format]
description = Apply Ruff formatting and autofixes
skip_install = true
deps =
    ruff>=0.6.0
commands =
    ruff check --fix .
    ruff format .

[testenv:lint]
description = Run linting and type checks
skip_install = true
deps =
    ruff>=0.6.0
    mypy>=1.11.0
commands =
    ruff check .
    mypy --follow-imports=skip sportran/current/results.py sportran/current/units sportran/md/tools sportran/md/aic.py sportran/utils/logger.py

[testenv:type]
description = Run mypy type checking
skip_install = true
deps =
    mypy>=1.11.0
commands =
    mypy --follow-imports=skip sportran/current/results.py sportran/current/units sportran/md/tools sportran/md/aic.py sportran/utils/logger.py

[testenv:docs]
description = Build Sphinx documentation
extras = doc
setenv =
    PATH = {envsitepackagesdir}/pypandoc/files:{env:PATH}
    PYPANDOC_PANDOC = {envsitepackagesdir}/pypandoc/files/pandoc
commands_pre =
    python -c "import pypandoc; pypandoc.get_pandoc_version()"
commands =
    sphinx-build -b html docs/source docs/_build/html

[testenv:notebooks]
description = Execute notebook-based tests only
extras = tests
setenv =
    MPLBACKEND = Agg
    MPLCONFIGDIR = {toxworkdir}/mplconfig
commands_pre =
    python -c "import matplotlib.font_manager as fm; fm._load_fontmanager(try_read_cache=False)"
commands =
    pytest -sv tests/test_notebooks.py
